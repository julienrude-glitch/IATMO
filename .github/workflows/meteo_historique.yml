          ERA5 = os.environ.get("SOURCE") == "era5"; DOS = "meteo_era5" if ERA5 else "meteo"; os.makedirs(DOS, exist_ok=True)
          API = os.environ.get("METEO_API") or ("https://archive-api.open-meteo.com/v1/archive" if ERA5 else "https://historical-forecast-api.open-meteo.com/v1/forecast")
          VARS = (["precipitation", "shortwave_radiation", "cloud_cover", "boundary_layer_height", "temperature_2m", "wind_speed_10m", "wind_direction_10m"] if ERA5 else
