# IATMO : météo horaire historique aux stations trafic, pour l'apprentissage et l'évaluation sur 2023-2025 (tâche ponctuelle).
# Source : API « Historical Forecast » d'Open-Meteo (archive des prévisions, licence CC BY 4.0), modèle AROME France HD de
# Météo-France (0,01°, archive depuis le 13/11/2022) en métropole ; meilleur modèle disponible (best_match) dans les DROM.
# Seconde source au choix (entrée « source ») : réanalyse ERA5 (API d'archive d'Open-Meteo, environ 25 km, CC BY 4.0), pour la
# pluie de 2023 (absente de l'archive AROME HD), le rayonnement solaire, la nébulosité et la hauteur de couche limite.
# Un point par groupe de stations trafic distantes de moins de 2 km (89 points), heures en temps universel.
# Résultat : branche « historique » du dépôt, dossiers meteo/ (AROME) et meteo_era5/ (ERA5), un fichier compressé par point.
# Quotas gratuits d'Open-Meteo (600 appels par minute, 5 000 par heure, 10 000 par jour ; une requête de plus de deux semaines
# compte pour plusieurs appels, soit environ 100 par point pour 2023-2026) : la tâche espace les requêtes selon leur poids (80 secondes
# pour une série complète, environ deux heures pour les 89 points), publie sa progression tous les 10 points et reprend là où elle
# s'est arrêtée si on la relance. Une relance ne demande que les jours qui manquent à la fin des séries existantes (une minute et
# 89 appels environ pour quelques jours) ; « Retélécharger les points déjà présents » refait les séries complètes. À lancer à la main : onglet Actions, « Météo historique (Open-Meteo) », « Run workflow ».
# À enregistrer dans le dépôt sous le nom .github/workflows/meteo_historique.yml
name: Météo historique (Open-Meteo)

on:
  workflow_dispatch:
    inputs:
      debut:
        description: "Premier jour (AAAA-MM-JJ)"
        default: "2023-01-01"
      fin:
        description: "Dernier jour (AAAA-MM-JJ ; vide = avant-hier)"
        default: ""
      refaire:
        description: "Retélécharger les points déjà présents"
        type: boolean
        default: false
      source:
        description: "Source : AROME HD (archive des prévisions) ou ERA5 (réanalyse)"
        type: choice
        options: [arome, era5]
        default: arome

permissions:
  contents: write

concurrency:
  group: meteo-historique
  cancel-in-progress: false

jobs:
  meteo:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    env:
      REPO: ${{ github.repository }}
      TOKEN: ${{ github.token }}
      DEBUT: ${{ inputs.debut }}
      FIN: ${{ inputs.fin }}
      REFAIRE: ${{ inputs.refaire }}
      SOURCE: ${{ inputs.source }}
    steps:
      - name: Reprendre la branche historique
        shell: bash
        run: |
          set -euo pipefail
          git init -q h && cd h
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          if git fetch -q --depth 1 origin historique 2>/dev/null; then git checkout -q -B historique FETCH_HEAD; echo "Branche historique reprise"
          else git checkout -q --orphan historique; echo "Branche historique créée"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Télécharger la météo horaire, point par point
