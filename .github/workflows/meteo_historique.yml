            {"id":"FR34048","lon":1.49247,"lat":48.44916,"drom":False,"stations":["FR34048"]},
            {"id":"FR34063","lon":1.32653,"lat":47.58654,"drom":False,"stations":["FR34063"]},
            {"id":"FR34064","lon":2.74011,"lat":48.00694,"drom":False,"stations":["FR34064"]},
            {"id":"FR35010","lon":1.25477,"lat":45.82997,"drom":False,"stations":["FR35010"]},
            {"id":"FR36032","lon":4.89013,"lat":44.9492,"drom":False,"stations":["FR36032"]},
            {"id":"FR37040","lon":-61.53713,"lat":16.25408,"drom":True,"stations":["FR37040"]},
            {"id":"FR38009","lon":55.61892,"lat":-20.91055,"drom":True,"stations":["FR38009"]},
            {"id":"FR38018","lon":55.31383,"lat":-20.94981,"drom":True,"stations":["FR38018"]},
            {"id":"FR38023","lon":55.47864,"lat":-21.33164,"drom":True,"stations":["FR38023"]},
            {"id":"FR38024","lon":55.30251,"lat":-21.22305,"drom":True,"stations":["FR38024"]},
            {"id":"FR38091","lon":55.33258,"lat":-20.92869,"drom":True,"stations":["FR38091"]},
            {"id":"FR38098","lon":55.40306,"lat":-21.27707,"drom":True,"stations":["FR38098"]},
            {"id":"FR39010","lon":-61.06349,"lat":14.61384,"drom":True,"stations":["FR39010","FR39011"]},
            {"id":"FR40009","lon":-52.32194,"lat":4.92083,"drom":True,"stations":["FR40009"]},
            {"id":"FR41060","lon":9.44639,"lat":42.70283,"drom":False,"stations":["FR41060"]},
            {"id":"FR41073","lon":8.73936,"lat":41.92997,"drom":False,"stations":["FR41073"]},
            {"id":"FR43001","lon":45.22321,"lat":-12.77294,"drom":True,"stations":["FR43001","FR43099"]},
            {"id":"FR50224","lon":2.88848,"lat":42.69587,"drom":False,"stations":["FR50224"]},
            {"id":"FR50225","lon":3.82787,"lat":43.61161,"drom":False,"stations":["FR50225"]},
            {"id":"FR50227","lon":3.89572,"lat":43.60883,"drom":False,"stations":["FR50227"]},
            {"id":"FR50232","lon":4.37792,"lat":43.8291,"drom":False,"stations":["FR50232"]},
            {"id":"FR82001","lon":6.02361,"lat":47.23597,"drom":False,"stations":["FR82001"]},
            {"id":"FR82020","lon":6.85928,"lat":47.64067,"drom":False,"stations":["FR82020"]},
            {"id":"FR82070","lon":6.35972,"lat":47.35129,"drom":False,"stations":["FR82070"]}
          ]
          ERA5 = os.environ.get("SOURCE") == "era5"; DOS = "meteo_era5" if ERA5 else "meteo"; os.makedirs(DOS, exist_ok=True)
          API = os.environ.get("METEO_API") or ("https://archive-api.open-meteo.com/v1/archive" if ERA5 else "https://historical-forecast-api.open-meteo.com/v1/forecast")
          VARS = (["precipitation", "shortwave_radiation", "cloud_cover", "boundary_layer_height", "temperature_2m", "wind_speed_10m", "wind_direction_10m"] if ERA5 else
                  ["temperature_2m", "relative_humidity_2m", "precipitation", "wind_speed_10m", "wind_direction_10m", "shortwave_radiation", "cloud_cover", "boundary_layer_height"])
          debut = os.environ.get("DEBUT") or "2023-01-01"
          fin = os.environ.get("FIN") or (dt.datetime.now(dt.timezone.utc).date() - dt.timedelta(days=6 if ERA5 else 2)).isoformat()   # ERA5 : environ 5 jours de délai
          refaire = os.environ.get("REFAIRE") == "true"
          # Rythme : Open-Meteo décompte une requête de n jours et v variables comme ⌈n / 14⌉ × ⌈v / 10⌉ appels ; 0,8 s par appel décompté
          # garde sous 5 000 appels par heure (environ 80 s pour une série complète 2023-2026, 1 s pour un complément de quelques jours).
          SEC = float(os.environ.get("SEC_APPEL") or 0.8)
          def poids(d1, d2, nv): return math.ceil(((dt.date.fromisoformat(d2) - dt.date.fromisoformat(d1)).days + 1) / 14) * math.ceil(nv / 10)
          json.dump({"debut": debut, "fin": fin, "variables": VARS, "points": POINTS}, open(f"{DOS}/points.json", "w", encoding="utf-8"), ensure_ascii=False, indent=0)
          def publier(msg):
              subprocess.run(["git", "add", "-A"], check=True)
              if subprocess.run(["git", "diff", "--cached", "--quiet"]).returncode == 0: return
              subprocess.run(["git", "commit", "-qm", msg], check=True)
              for k in range(3):
                  if subprocess.run(["git", "push", "-q", "origin", "HEAD:refs/heads/historique"]).returncode == 0: print("publié :", msg); return
                  time.sleep(10)
              raise SystemExit("échec de la publication")
          def obtenir(p, variables, d1):
              q = {"latitude": p["lat"], "longitude": p["lon"], "start_date": d1, "end_date": fin, "hourly": ",".join(variables),
                   "timezone": "GMT", "wind_speed_unit": "ms"}
              if not p["drom"] and not ERA5: q["models"] = "meteofrance_arome_france_hd"
              req = urllib.request.Request(API + "?" + urllib.parse.urlencode(q), headers={"User-Agent": "IATMO"})
              with urllib.request.urlopen(req, timeout=180) as r: return json.loads(r.read())
          etat = {"dernier": 0.0, "pause": 0.0}
          def telecharger(p, variables, d1):                                  # rend (réponse, erreur, code HTTP)
              essais = 0
              while True:
                  attente = etat["pause"] - (time.time() - etat["dernier"])
                  if attente > 0: time.sleep(attente)
                  etat["dernier"] = time.time(); etat["pause"] = SEC * poids(d1, fin, len(variables))
                  try: return obtenir(p, variables, d1), None, None
                  except urllib.error.HTTPError as e:
                      corps = e.read().decode("utf-8", "replace")[:300]
                      if e.code == 400 and "boundary_layer_height" in variables:
                          print(p["id"], ": couche limite indisponible pour ce modèle, abandonnée"); variables.remove("boundary_layer_height"); sans[p["drom"]].add("boundary_layer_height"); continue
                      if e.code == 429 and essais < 3: essais += 1; print(p["id"], ": quota atteint, pause de 10 minutes (", corps, ")"); time.sleep(600); continue
                      if e.code >= 500 and essais < 4: essais += 1; print(p["id"], f": erreur passagère du serveur (HTTP {e.code}), nouvel essai dans {60 * essais} s"); time.sleep(60 * essais); continue
                      return None, f"HTTP {e.code} {corps[:120]}", e.code
                  except Exception as e:
                      if essais < 4: essais += 1; print(p["id"], ": erreur", str(e)[:120], f", nouvel essai dans {60 * essais} s"); time.sleep(60 * essais); continue
                      return None, str(e)[:200], None
          faits = 0; arret = None; echecs = []; sans = {False: set(), True: set()}          # variables refusées, métropole / DROM
          for i, p in enumerate(POINTS):
              f = f"{DOS}/{p['id']}.json.gz"; anc = None; d1 = debut
              if not refaire and os.path.exists(f):
                  try:
                      with gzip.open(f, "rt", encoding="utf-8") as g: o = json.load(g)
                      if o.get("debut") == debut:
                          if o.get("fin", "") >= fin: continue
                          # Complément : seuls les jours après la fin de la série existante sont demandés, puis ajoutés (raccord vérifié à l'heure près)
                          if o.get("t0") and o.get("heures"): anc = o; d1 = (dt.date.fromisoformat(o["fin"]) + dt.timedelta(days=1)).isoformat()
                  except Exception: pass
              variables = [v for v in VARS if v not in sans[p["drom"]]]
              if anc: variables = [v for v in variables if v in anc["valeurs"]] or variables     # mêmes variables que la série existante
              j, erreur, code = telecharger(p, variables, d1)
              if not erreur and anc:
                  t = j.get("hourly", {}).get("time", [])
                  suite = (dt.datetime.fromisoformat(anc["t0"].replace("Z", "")) + dt.timedelta(hours=anc["heures"])).strftime("%Y-%m-%dT%H:%M")
                  if not t or t[0] != suite:
                      print(p["id"], ": raccord impossible (", t[0] if t else "réponse vide", "au lieu de", suite, "), série complète retéléchargée")
                      anc = None; d1 = debut; variables = [v for v in VARS if v not in sans[p["drom"]]]
                      j, erreur, code = telecharger(p, variables, d1)
              if erreur:                                                              # point sauté : la relance le reprendra
                  echecs.append(p["id"]); print(p["id"], ": abandonné pour ce passage (", erreur, ")")
                  if code == 429: arret = f"quota épuisé à {p['id']}"; break
                  continue
              h = j.get("hourly", {}); t = h.get("time", [])
              val = {v: [None if x is None else round(x, 2) for x in h.get(v, [])] for v in variables if v in h}
              if anc:                                                                 # série existante + complément, variable par variable
                  na, nb = anc["heures"], len(t)
                  val = {v: (anc["valeurs"].get(v) or [None] * na) + (val.get(v) or [None] * nb) for v in set(anc["valeurs"]) | set(val)}
                  t0, nh = anc["t0"], na + nb
              else: t0, nh = ((t[0] + "Z") if t else None), len(t)
              val = {v: x for v, x in val.items() if any(y is not None for y in x)}       # variables entièrement vides écartées
              sortie = {"id": p["id"], "lon": p["lon"], "lat": p["lat"], "stations": p["stations"], "drom": p["drom"],
                        "modele": "era5 (archive best_match)" if ERA5 else ("meteofrance_arome_france_hd" if not p["drom"] else "best_match"),
                        "grille": anc["grille"] if anc else [j.get("longitude"), j.get("latitude"), j.get("elevation")],
                        "debut": debut, "fin": fin, "t0": t0, "heures": nh, "unites": j.get("hourly_units", {}) or (anc or {}).get("unites", {}), "valeurs": val}
              with gzip.open(f, "wt", encoding="utf-8") as g: json.dump(sortie, g, separators=(",", ":"))
              faits += 1; print(f"{i + 1}/{len(POINTS)} {p['id']} ({', '.join(p['stations'])}) : {nh} heures" + (f" (dont {len(t)} ajoutées)" if anc else "") + f", {len(val)} variables")
              if faits % 10 == 0: publier(f"Météo historique ({DOS}) : {faits} points de plus")
          open("LISEZMOI.txt", "w", encoding="utf-8").write(
              "Données historiques pour l'apprentissage et l'évaluation d'IATMO (tâche .github/workflows/meteo_historique.yml).\n"
              "- meteo/ : météo horaire (temps universel) aux stations trafic, un fichier compressé par point (stations à moins de 2 km regroupées) ;\n"
              "  source : Open-Meteo, API Historical Forecast (licence CC BY 4.0), modèle AROME France HD de Météo-France en métropole,\n"
              "  meilleur modèle disponible dans les DROM ; points.json liste les points, les stations rattachées et la période ;\n"
              "- meteo_era5/ : mêmes points, réanalyse ERA5 (API d'archive d'Open-Meteo, CC BY 4.0) : pluie (y compris 2023), rayonnement,\n"
              "  nébulosité, hauteur de couche limite, température et vent.\n")
          publier(f"Météo historique ({DOS}) du {debut} au {fin}" + (f" (arrêt : {arret})" if arret else "") + (f" (points à reprendre : {', '.join(echecs)})" if echecs else ""))
          n = sum(1 for p in POINTS if os.path.exists(f"{DOS}/{p['id']}.json.gz"))
          print(f"Points disponibles : {n}/{len(POINTS)}")
          if arret or echecs: raise SystemExit("Incomplet : " + " ; ".join(x for x in (arret, "points à reprendre : " + ", ".join(echecs) if echecs else None) if x) + " — relancer la tâche plus tard, elle ne refera que les points manquants.")
          PY
