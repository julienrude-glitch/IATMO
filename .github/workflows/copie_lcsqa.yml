                                     "colonnes": ["vitesse", "direction", "pluie", "temperature", "humidite"], "stations": val}, g, ensure_ascii=False, separators=(",", ":"))
                      print("prévisions archivées :", fp, len(val), "stations")
              lp = (maintenant - dt.timedelta(days=60)).strftime("%Y-%m-%d")
              for f in glob.glob("previsions/*.json.gz"):
                  if os.path.basename(f)[:10] < lp: os.remove(f)
          except Exception as e: print("archive des prévisions impossible :", str(e)[:120])
          print(json.dumps({k: etat[k] for k in ("heures_remplies", "Paris_heure_courante", "Fort-de-France_12h_locale", "Saint-Denis_12h_locale")}, ensure_ascii=False), "|", len(faits), "heures extraites")
          if not any(index[J0 + "|METRO"]): raise SystemExit("Aucune heure AROME extraite pour la métropole (voir arome/etat.json)")
          PY

      - name: Prévisions Prev'air aux stations (archive, une fois par jour après 9 h)
        id: prevair
        continue-on-error: true
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import h5py" 2>/dev/null || python3 -m pip install -q --user --break-system-packages h5py >/dev/null 2>&1 || python3 -m pip install -q --user h5py >/dev/null
          python3 - <<'PY'
          # Prévisions Prev'air (Ineris, data.gouv.fr, NetCDF 4) du jour et du lendemain, émises le jour même : maximum horaire (O3, NO2) ou
          # moyenne (PM10, PM2,5), lues aux stations (stations_ref.json), pour comparer la prévision d'IATMO à celle de Prev'air sur l'historique.
          # Fichier prevair/AAAA-MM-JJ.json.gz : {"emis", "fichiers", "valeurs": {station: {"O3_max_j0": …}}} ; 400 jours gardés.
          import json, os, re, io, gzip, glob, datetime as dt, urllib.request
          from zoneinfo import ZoneInfo
          import numpy as np, h5py
          PARIS = ZoneInfo("Europe/Paris"); now = dt.datetime.now(PARIS); J = now.strftime("%Y-%m-%d")
          os.makedirs("out/prevair", exist_ok=True); fo = f"out/prevair/{J}.json.gz"
          def lire(u, delai=60): return urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "IATMO"}), timeout=delai).read()
          if os.path.exists(fo) and os.environ.get("FORCE") != "true": print("Prev'air déjà archivé aujourd'hui"); raise SystemExit(0)
          if now.hour < 9: print("Avant 9 h : prévisions du jour pas encore attendues"); raise SystemExit(0)
          jeu = json.loads(lire("https://www.data.gouv.fr/api/1/datasets/prevair-previsions-de-la-qualite-de-lair-pour-la-france-air-quality-forecasts-for-france/"))
          motif = re.compile(r"prevision\.(\d{8})\.(moy|max)j(\d)\.(o3|no2|pm10|pm25)\.", re.I); choix = {}
          for r in jeu.get("resources", []):
              m = motif.search(r.get("title") or "") or motif.search(r.get("url") or "")
              if not m or f"{m[1][:4]}-{m[1][4:6]}-{m[1][6:]}" != J: continue
              pol, stat, ech = m[4].upper(), m[2].lower(), int(m[3])
              if ech <= 1 and stat == ("max" if pol in ("O3", "NO2") else "moy"): choix[(pol, stat, ech)] = r["url"]
          if not choix: print("Prev'air : aucune prévision émise aujourd'hui pour l'instant"); raise SystemExit(0)
          ref = json.loads(lire("https://raw.githubusercontent.com/" + os.environ.get("REPO", "") + "/main/stations_ref.json", 30))
          co = {c: ((r["lon"], r["lat"]) if isinstance(r, dict) else (r[0], r[1])) for c, r in ref.items()}
          valeurs, fichiers = {}, {}
          for (pol, stat, ech), url in sorted(choix.items()):
              try:
                  with h5py.File(io.BytesIO(lire(url, 120)), "r") as h:
                      var = [k for k in h.keys() if k not in ("lat", "lon", "time") and getattr(h[k], "ndim", 0) == 3][0]
                      la, lo, V = h["lat"][:], h["lon"][:], h[var][0]
              except Exception as e: print("lecture impossible :", url, str(e)[:100]); continue
              cle = f"{pol}_{stat}_j{ech}"; fichiers[cle] = url.rsplit("/", 1)[-1]; dla, dlo = abs(la[1] - la[0]), abs(lo[1] - lo[0])
              for c, (x, y) in co.items():
                  if not (la.min() - dla <= y <= la.max() + dla and lo.min() - dlo <= x <= lo.max() + dlo): continue
                  v = float(V[int(np.argmin(abs(la - y))), int(np.argmin(abs(lo - x)))])
                  if np.isfinite(v) and 0 <= v < 1e4: valeurs.setdefault(c, {})[cle] = round(v, 1)
          if not valeurs: raise SystemExit("Prev'air : aucun champ lu")
          with gzip.open(fo, "wt", encoding="utf-8") as g:
              json.dump({"emis": J, "fichiers": fichiers, "valeurs": valeurs}, g, ensure_ascii=False, separators=(",", ":"))
          lim = (now - dt.timedelta(days=400)).strftime("%Y-%m-%d")
          for f in glob.glob("out/prevair/*.json.gz"):
              if os.path.basename(f)[:10] < lim: os.remove(f)
          print("Prev'air archivé :", fo, len(valeurs), "stations,", sorted(fichiers))
          PY

      - name: Historique (calage et performances, une fois par jour après 4 h)
        id: historique
        continue-on-error: true
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          cd out
          J="$(TZ=Europe/Paris date +%F)"; H="$(TZ=Europe/Paris date +%-H)"
          if [ "${FORCE:-false}" != "true" ]; then
            if [ "$H" -lt 4 ]; then echo "Avant 4 h : le LCSQA n'a pas encore publié la fin de la veille."; exit 0; fi
            if [ -f calage/calage.json ] && grep -q "\"maj\":\"$J" calage/calage.json; then echo "Historique déjà calculé aujourd'hui."; exit 0; fi
          fi
          # Script et référentiels sur la branche principale du dépôt, à la racine (historique.py, stations_ref.json, fiches_stations.json)
          # ou dans les dossiers outils/ et ref/
          git fetch -q --depth 1 origin main
          rm -rf /tmp/ref && mkdir -p /tmp/ref
          for f in historique.py stations_ref.json fiches_stations.json; do
            git show "FETCH_HEAD:$f" > "/tmp/ref/$f" 2>/dev/null || git show "FETCH_HEAD:outils/$f" > "/tmp/ref/$f" 2>/dev/null || git show "FETCH_HEAD:ref/$f" > "/tmp/ref/$f"
          done
          python3 -c "import numpy" 2>/dev/null || python3 -m pip install -q --user --break-system-packages numpy >/dev/null 2>&1 || python3 -m pip install -q --user numpy >/dev/null
          # scikit-learn : correction apprise des résidus (gradient boosting) ; sans lui, historique.py saute cette évaluation
          python3 -c "import sklearn" 2>/dev/null || python3 -m pip install -q --user --break-system-packages scikit-learn >/dev/null 2>&1 || python3 -m pip install -q --user scikit-learn >/dev/null 2>&1 || echo "scikit-learn non installé"
          python3 /tmp/ref/historique.py . /tmp/ref

      - name: Publier sur la branche donnees
        if: steps.lcsqa.outcome == 'success' || steps.trafic.outcome == 'success' || steps.paris.outcome == 'success' || steps.arome.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          cd out
          printf '%s\n' "Copie automatique de données publiques pour IATMO." \
            "Licences : Licence Ouverte (Etalab), sauf trafic/paris.json, base dérivée du jeu « Comptage routier – Données trafic issues des capteurs permanents » de la Ville de Paris, diffusée sous ODbL (Open Database License) : toute réutilisation cite « Ville de Paris » et reste sous ODbL. Sources à citer : Météo-France (arome/), LCSQA – Geod'air (lcsqa/, archive/), Bison Futé (trafic/points.json)." \
            "Contenu :" \
            "- lcsqa/ : fichiers temps réel du LCSQA (data.gouv.fr), jour et veille ;" \
            "- trafic/ : débits et vitesses Bison Futé sur le réseau national non concédé (data.gouv.fr) : fichiers bruts du moment, dernier état par point, points.json pour IATMO, archive horaire de 60 jours ; paris.json : débits horaires des capteurs permanents de la Ville de Paris (opendata.paris.fr, ODbL), profil type par jour de la semaine et par heure (médiane des 4 derniers jours de ce type publiés, hors jours fériés et vacances scolaires de la zone C), tiré de l'archive quotidienne paris_jours/ (56 jours) ;" \
            "- arome/ : vent à 10 m, pluie, température et humidité à 2 m AROME (Météo-France) heure par heure, aujourd'hui et demain : métropole sur une grille de 0,1° (AAAA-MM-JJ.bin et ta-AAAA-MM-JJ.bin, 30 jours gardés), DROM en AROME Outre-Mer (om-AAAA-MM-JJ.bin, om-ta-AAAA-MM-JJ.bin) ; jours du 21/10 au 21/11/2026 restaurés aux seules stations trafic (Open-Meteo) ;" \
            "- arome/previsions/ : prévisions AROME telles qu'émises à 8 h, 12 h et 16 h, aux stations, pour les heures restantes du jour (60 jours) ;" \
            "- prevair/ : prévisions Prev'air (Ineris) du jour et du lendemain lues aux stations, une fois par jour (400 jours) ;" \
            "- archive/lcsqa/ : mesures horaires du LCSQA par station (NO, NO2, NOx, O3, PM10, PM2,5, SO2), un fichier compressé par jour sur 180 jours, et table des stations ;" \
            "- suivi/ : journal des passages (3 jours), première apparition de chaque heure du LCSQA (30 jours) et performances quotidiennes du krigeage (90 jours), progression du calage (calage_jours.json, 400 jours), lus par l'onglet Évaluation ;" \
            "- calage/ : calage de l'effet routier sur les 30 derniers jours (incrément, profil horaire, vent, pluie, trafic et confinement), lu par la carte." \
            "Branche réécrite à chaque passage par la tâche .github/workflows/copie_lcsqa.yml : ne pas y travailler." > LISEZMOI.txt
          # Journal des passages (3 jours) : heure, durée, déclencheur et résultat de chaque partie, lu par l'onglet Évaluation
          mkdir -p suivi
          LCSQA="${{ steps.lcsqa.outcome }}" TRAFIC="${{ steps.trafic.outcome }}" AROME="${{ steps.arome.outcome }}" HIST="${{ steps.historique.outcome }}" PARIS_T="${{ steps.paris.outcome }}" EVT="${EVENEMENT}" python3 - <<'PY'
          import json, os, time, datetime as dt
          from zoneinfo import ZoneInfo
          f = "suivi/journal.json"
          try: j = json.load(open(f, encoding="utf-8"))
          except Exception: j = []
          deb = int(os.environ.get("DEBUT") or time.time()); P = ZoneInfo("Europe/Paris")
          j.append({"t": dt.datetime.fromtimestamp(deb, P).isoformat(timespec="seconds"), "duree": int(time.time()) - deb, "evt": os.environ["EVT"],
                    "lcsqa": os.environ["LCSQA"], "trafic": os.environ["TRAFIC"], "arome": os.environ["AROME"], "historique": os.environ.get("HIST", ""), "paris": os.environ.get("PARIS_T", "")})
          json.dump(j[-432:], open(f, "w", encoding="utf-8"), ensure_ascii=False, separators=(",", ":"))
          print("journal :", len(j[-432:]), "passages")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          ARBRE="$(git write-tree)"
          COMMIT="$(git commit-tree "$ARBRE" -m "Copie du $(TZ=Europe/Paris date '+%d/%m/%Y à %H:%M') (LCSQA : ${{ steps.lcsqa.outcome }}, trafic : ${{ steps.trafic.outcome }}, AROME : ${{ steps.arome.outcome }})")"
          git push -qf origin "$COMMIT:refs/heads/donnees"
          echo "Copie publiée : https://raw.githubusercontent.com/${REPO}/donnees/LISEZMOI.txt"

      - name: Signaler l'échec de toutes les copies
        if: steps.lcsqa.outcome != 'success' && steps.trafic.outcome != 'success' && steps.arome.outcome != 'success'
        shell: bash
        run: |
          echo "Ni les mesures du LCSQA ni le trafic n'ont pu être copiés : la branche n'est pas modifiée."; exit 1
