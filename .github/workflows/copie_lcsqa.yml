# IATMO : copie des données publiques sur la branche « donnees » du dépôt, toutes les 10 minutes.
# Déclenchement : appel de l'API GitHub toutes les 10 minutes par un service externe (cron-job.org, jeton limité à ce dépôt et
# à la permission Actions), car GitHub saute une grande partie des passages planifiés ; planification GitHub gardée en secours.
# 1. Fichiers « temps réel » du LCSQA (data.gouv.fr) : files.data.gouv.fr n'autorise pas la lecture depuis une
#    autre page web (en-tête CORS absent), alors que raw.githubusercontent.com l'autorise.
# 2. Débits et vitesses Bison Futé sur le réseau national routier non concédé (data.gouv.fr, Licence Ouverte) :
#    fichiers bruts du moment, dernier état par point de mesure et archive horaire (60 jours), pour caler plus tard
#    l'effet routier d'IATMO sur le trafic réel ; fichier points.json (coordonnées, débits et vitesses du jour)
#    lu par IATMO.
# 4. AROME (Météo-France, data.gouv.fr) : vent à 10 m et pluie de chaque heure du jour, extraits du calcul le plus récent
#    (seuls les champs utiles sont téléchargés) et moyennés sur une grille de 0,1° (environ 10 km), lue par la carte ; 30 jours gardés.
# 5. Historique, une fois par jour : calage sur les 30 derniers jours (calage/calage.json), performances quotidiennes du krigeage
#    (suivi/performances.json) et progression du calage avec la correction apprise des résidus (suivi/calage_jours.json),
#    par le script historique.py de la branche principale (racine du dépôt) ; numpy et scikit-learn installés au besoin.
# 3. Archive des mesures du LCSQA (180 jours) : une ligne par station et par heure, valeurs de NO, NO2, NOx, O3, PM10,
#    PM2,5 et SO2, pour caler le modèle sur un historique.
# À enregistrer dans le dépôt sous le nom .github/workflows/copie_lcsqa.yml
# La branche « donnees » ne garde qu'un seul état (poussée forcée) : l'historique du dépôt ne grossit pas.
name: Copie des mesures LCSQA et du trafic

on:
  schedule:
    - cron: "17,47 * * * *"         # secours toutes les 30 minutes, si le déclencheur externe ne passe pas
  workflow_dispatch:                # bouton « Run workflow » de l'onglet Actions, et appels de cron-job.org
    inputs:
      force:
        description: "Réextraire toutes les heures AROME du jour"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: copie-lcsqa
  cancel-in-progress: false         # un passage en cours va jusqu'au bout ; le suivant attend

jobs:
  copie:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE: https://files.data.gouv.fr/ineris/lcsqa/concentrations-de-polluants-atmospheriques-reglementes/temps-reel
      TRAFIC_1: https://www.data.gouv.fr/api/1/datasets/r/625048a9-9d8f-4a6b-a7bf-b62094fb2c2e
      TRAFIC_2: https://www.data.gouv.fr/api/1/datasets/r/82673e5e-904f-41ae-8e1f-c64ff4095c1b
      TRAFIC_3: https://www.data.gouv.fr/api/1/datasets/r/501e1cee-2961-41dc-b229-d14ba96819a8
      AROME_BASE: https://meteofrance-pnt.s3.rbx.io.cloud.ovh.net
      AROME_API: https://www.data.gouv.fr/api/1/datasets/paquets-arome-resolution-0-01deg/
      EVENEMENT: ${{ github.event_name }}
      FORCE: ${{ inputs.force }}
      REPO: ${{ github.repository }}
      TOKEN: ${{ github.token }}
    steps:
      - name: Reprendre la branche donnees
        shell: bash
        run: |
          set -euo pipefail
          echo "DEBUT=$(date +%s)" >> "$GITHUB_ENV"                          # pour le journal des passages (suivi/journal.json)
          DEST="${DEST:-https://x-access-token:${TOKEN}@github.com/${REPO}.git}"
          git init -q out
          cd out
          git remote add origin "$DEST"
          if git fetch -q --depth 1 origin donnees 2>/dev/null; then
            git checkout -q -B donnees FETCH_HEAD; echo "Branche donnees reprise"
          else
            git checkout -q --orphan donnees; echo "Branche donnees créée"
          fi

      - name: Mesures du LCSQA (jour et veille)
        id: lcsqa
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export TZ=Europe/Paris
          rm -rf tmp_lcsqa && mkdir -p tmp_lcsqa
          entrees=""
          for D in "$(date +%F)" "$(date -d yesterday +%F)"; do
            AN="${D:0:4}"; D2="${D//-/}"
            LISTE="$(curl -fsSL --retry 3 --max-time 60 "$SOURCE/$AN/" || true)"
            NOMS="$(printf '%s' "$LISTE" | grep -oE '[A-Za-z0-9_.-]+\.csv' | sort -u || true)"
            NOM="$(printf '%s\n' "$NOMS" | grep -x "FR_E2_$D.csv" || true)"
            [ -n "$NOM" ] || NOM="$(printf '%s\n' "$NOMS" | grep -E "($D|$D2)" | grep 'E2' | tail -n 1 || true)"
            [ -n "$NOM" ] || NOM="$(printf '%s\n' "$NOMS" | grep -E "($D|$D2)" | tail -n 1 || true)"
            [ -n "$NOM" ] || NOM="FR_E2_$D.csv"
            if curl -fsSL --retry 3 --max-time 300 -o "tmp_lcsqa/$NOM" "$SOURCE/$AN/$NOM" \
               && [ "$(head -c 2000 "tmp_lcsqa/$NOM" | grep -ci 'polluant' || true)" != "0" ]; then
              echo "$D : $NOM ($(wc -c < "tmp_lcsqa/$NOM") octets)"
              entrees="$entrees${entrees:+,}\"$D\":\"$NOM\""
            else
              echo "$D : aucun fichier lisible ($NOM)"; rm -f "tmp_lcsqa/$NOM"
            fi
          done
          if [ -z "$entrees" ]; then echo "Aucun fichier du LCSQA copié : la copie précédente est gardée."; exit 1; fi
          printf '{"maj":"%s","source":"%s","fichiers":{%s}}\n' "$(date -Iseconds)" "$SOURCE" "$entrees" > tmp_lcsqa/etat.json
          rm -rf out/lcsqa && mv tmp_lcsqa out/lcsqa
          cat out/lcsqa/etat.json
          python3 - <<'PY'
          import csv, gzip, io, os, glob, json, datetime as dt
          from zoneinfo import ZoneInfo
          POL = {"NO": "NO", "NO2": "NO2", "NOX as NO2": "NOX", "O3": "O3", "PM10": "PM10", "PM2.5": "PM25", "SO2": "SO2"}
          COLS = ["NO", "NO2", "NOX", "O3", "PM10", "PM25", "SO2"]
          os.makedirs("out/archive/lcsqa", exist_ok=True)
          fst = "out/archive/lcsqa/stations.csv"; stations = {}
          if os.path.exists(fst):
              with open(fst, encoding="utf-8", newline="") as fi:
                  for r in csv.DictReader(fi, delimiter=";"): stations[r["code"]] = r
          etat = json.load(open("out/lcsqa/etat.json", encoding="utf-8"))
          for jour, nom in etat["fichiers"].items():
              acc = {}
              with open("out/lcsqa/" + nom, encoding="utf-8-sig", newline="") as fi:
                  rd = csv.reader(fi, delimiter=";"); H = next(rd); ix = {h: i for i, h in enumerate(H)}
                  for x in rd:
                      if len(x) < len(H): continue
                      p = POL.get(x[ix["Polluant"]]); val = x[ix["valeur"]]
                      if not p or not val: continue
                      try:
                          if float(x[ix["validité"]]) <= 0: continue
                      except ValueError: continue
                      code = x[ix["code site"]]; h = x[ix["Date de début"]].replace("/", "-")[:13]
                      acc.setdefault((code, h), {})[p] = val
                      stations[code] = {"code": code, "nom": x[ix["nom site"]], "organisme": x[ix["Organisme"]], "implantation": x[ix["type d'implantation"]],
                                        "influence": x[ix["type d'influence"]], "zas": x[ix["Zas"]]}
              buf = io.StringIO(); w = csv.writer(buf, delimiter=";"); w.writerow(["code", "heure"] + COLS)
              for (code, h), d in sorted(acc.items()): w.writerow([code, h] + [d.get(c, "") for c in COLS])
              with gzip.open("out/archive/lcsqa/" + jour + ".csv.gz", "wt", encoding="utf-8") as fo: fo.write(buf.getvalue())
              print("archive LCSQA", jour, ":", len(acc), "couples station-heure")
          with open(fst, "w", encoding="utf-8", newline="") as fo:
              w = csv.DictWriter(fo, fieldnames=["code", "nom", "organisme", "implantation", "influence", "zas"], delimiter=";"); w.writeheader()
              for c in sorted(stations): w.writerow(stations[c])
          # Suivi de la publication : première apparition de chaque heure du fichier du jour, nombre de stations, par organisme (30 jours)
          PARIS = ZoneInfo("Europe/Paris"); maint = dt.datetime.now(PARIS); jour = maint.strftime("%Y-%m-%d")
          os.makedirs("out/suivi", exist_ok=True); fa = "out/suivi/lcsqa_arrivees.json"
          try: arr = json.load(open(fa, encoding="utf-8"))
          except Exception: arr = {}
          nom = etat["fichiers"].get(jour)
          if nom:
              vus = {}
              with open("out/lcsqa/" + nom, encoding="utf-8-sig", newline="") as fi:
                  rd = csv.reader(fi, delimiter=";"); H = next(rd); ix = {h: i for i, h in enumerate(H)}
                  for x in rd:
                      if len(x) < len(H) or not x[ix["valeur"]]: continue
                      h = x[ix["Date de début"]][11:13]; d = vus.setdefault(h, {"st": set(), "org": {}})
                      d["st"].add(x[ix["code site"]]); o = x[ix["Organisme"]]; d["org"][o] = d["org"].get(o, 0) + 1
              aj = arr.setdefault(jour, {}); t = maint.isoformat(timespec="seconds")
              for h, d in vus.items():
                  e = aj.setdefault(h, {"t": t, "n": 0, "tn": t, "org": {}})
                  if len(d["st"]) > e["n"]: e["n"] = len(d["st"]); e["tn"] = t
                  for o in d["org"]: e["org"].setdefault(o, t)
          arr = {j: arr[j] for j in sorted(arr)[-30:]}
          json.dump(arr, open(fa, "w", encoding="utf-8"), ensure_ascii=False, separators=(",", ":"))
          print("suivi LCSQA :", len(arr.get(jour, {})), "heures vues aujourd'hui")
          limite = (dt.datetime.now(ZoneInfo("Europe/Paris")) - dt.timedelta(days=180)).strftime("%Y-%m-%d")
          for fa in glob.glob("out/archive/lcsqa/*.csv.gz"):
              if os.path.basename(fa)[:10] < limite: os.remove(fa)
          PY

      - name: Trafic Bison Futé (réseau national non concédé)
        id: trafic
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/trafic/brut out/trafic/archive
          cd out/trafic
          ok=0
          for k in 1 2 3; do
            URL="TRAFIC_$k"; URL="${!URL}"
            rm -f "brut/tmp_$k"
            if curl -fsSL --retry 3 --max-time 180 -o "brut/tmp_$k" "$URL"; then
              ext=csv; [ "$(head -c 300 "brut/tmp_$k" | grep -c '<' || true)" != "0" ] && ext=xml
              [ "$(head -c 600 "brut/tmp_$k" | grep -ci '<html' || true)" != "0" ] && ext=html
              rm -f "brut/fichier_$k".*; mv "brut/tmp_$k" "brut/fichier_$k.$ext"
              [ "$ext" = html ] && echo "fichier_$k : page HTML (liste de dossier), non exploitée"
              echo "fichier_$k.$ext : $(wc -c < "brut/fichier_$k.$ext") octets"; ok=1
            else
              echo "fichier_$k : échec du téléchargement"; rm -f "brut/tmp_$k"
            fi
          done
          [ "$ok" = 1 ] || exit 1
          python3 - <<'PY'
          import xml.etree.ElementTree as ET, csv, gzip, json, os, glob, io, collections, datetime as dt
          from zoneinfo import ZoneInfo
          PARIS = ZoneInfo("Europe/Paris"); XSI = "{http://www.w3.org/2001/XMLSchema-instance}type"
          def loc(t): return t.rsplit("}", 1)[-1]
          def nombre(x):
              try: return float(x.strip().replace(",", "."))
              except Exception: return None
          sites = {}; types = collections.Counter(); racines = {}; erreurs = []
          for f in sorted(glob.glob("brut/*.xml")):
              nom = os.path.basename(f); n0 = len(sites)
              try:
                  for ev, el in ET.iterparse(f, events=("start", "end")):
                      if ev == "start":
                          racines.setdefault(nom, loc(el.tag)); continue
                      if loc(el.tag) != "siteMeasurements": continue
                      sid = t = None; debits = []; vitesses = []
                      for c in el.iter():
                          cn = loc(c.tag)
                          if cn == "measurementSiteReference": sid = c.get("id") or (c.text or "").strip() or sid
                          elif cn == "measurementTimeDefault" and t is None: t = (c.text or "").strip()
                          elif cn == "basicData":
                              ty = (c.get(XSI) or "?").split(":")[-1]; types[ty] += 1
                              for d in c.iter():
                                  dn = loc(d.tag)
                                  if dn == "vehicleFlowRate" and d.text and nombre(d.text) is not None: debits.append(nombre(d.text))
                                  elif dn == "speed" and d.text and nombre(d.text) is not None: vitesses.append(nombre(d.text))
                      if sid and (debits or vitesses): sites[sid] = (t, debits, vitesses)
                      el.clear()
              except ET.ParseError as e:
                  erreurs.append(nom + " : " + str(e))
              print(nom, ":", len(sites) - n0, "points de mesure lus")
          # dernier état par point : débit = somme des valeurs (voies), vitesse = moyenne ; nombres de valeurs gardés
          with open("dernier.csv", "w", newline="", encoding="utf-8") as fo:
              w = csv.writer(fo, delimiter=";")
              w.writerow(["point", "horodatage", "debit_veh_h", "vitesse_km_h", "n_debits", "n_vitesses"])
              for sid, (t, de, vi) in sorted(sites.items()):
                  w.writerow([sid, t or "", round(sum(de)) if de else "", round(sum(vi) / len(vi), 1) if vi else "", len(de), len(vi)])
          # archive horaire : moyennes par point et par heure locale, un fichier compressé par jour
          vus = {}
          if os.path.exists("vus.json"):
              try: vus = json.load(open("vus.json", encoding="utf-8"))
              except Exception: vus = {}
          ajouts = collections.defaultdict(list)
          for sid, (t, de, vi) in sites.items():
              if not t or vus.get(sid) == t: continue
              try: h = dt.datetime.fromisoformat(t.replace("Z", "+00:00")).astimezone(PARIS)
              except Exception: continue
              vus[sid] = t
              ajouts[h.strftime("%Y-%m-%d")].append((sid, h.strftime("%H"), sum(de) if de else None, sum(vi) / len(vi) if vi else None, len(de), len(vi)))
          for jour, lignes in ajouts.items():
              fa = "archive/" + jour + ".csv.gz"; acc = {}
              if os.path.exists(fa):
                  with gzip.open(fa, "rt", encoding="utf-8") as fi:
                      for r in csv.DictReader(fi, delimiter=";"):
                          acc[(r["point"], r["heure"])] = [float(r["somme_debit"] or 0), int(r["n_debit"]), float(r["somme_vitesse"] or 0), int(r["n_vitesse"]), int(r["valeurs_debit"]), int(r["valeurs_vitesse"])]
              for sid, hh, de, vi, nd, nv in lignes:
                  a = acc.setdefault((sid, hh), [0.0, 0, 0.0, 0, nd, nv])
                  if de is not None: a[0] += de; a[1] += 1
                  if vi is not None: a[2] += vi; a[3] += 1
                  a[4] = max(a[4], nd); a[5] = max(a[5], nv)
              buf = io.StringIO(); w = csv.writer(buf, delimiter=";")
              w.writerow(["point", "heure", "somme_debit", "n_debit", "somme_vitesse", "n_vitesse", "valeurs_debit", "valeurs_vitesse"])
              for (sid, hh), a in sorted(acc.items()):
                  w.writerow([sid, hh, round(a[0], 1), a[1], round(a[2], 1), a[3], a[4], a[5]])
              with gzip.open(fa, "wt", encoding="utf-8") as fo: fo.write(buf.getvalue())
              print("archive", jour, ":", len(acc), "couples point-heure")
          limite = (dt.datetime.now(PARIS) - dt.timedelta(days=60)).strftime("%Y-%m-%d")
          for fa in glob.glob("archive/*.csv.gz"):
              if os.path.basename(fa)[:10] < limite: os.remove(fa)
          json.dump(vus, open("vus.json", "w", encoding="utf-8"))
          horos = sorted(t for t, de, vi in sites.values() if t)
          etat = {"maj": dt.datetime.now(PARIS).isoformat(timespec="seconds"), "points": len(sites),
                  "horodatage_min": horos[0] if horos else None, "horodatage_max": horos[-1] if horos else None,
                  "types_de_donnees": dict(types), "racines_xml": racines, "erreurs": erreurs,
                  "fichiers": {os.path.basename(f): os.path.getsize(f) for f in sorted(glob.glob("brut/*"))},
                  "valeurs_par_point": {f"{a} débits / {b} vitesses": n for (a, b), n in collections.Counter((len(de), len(vi)) for t, de, vi in sites.values()).most_common(8)},
                  "archive": sorted(os.path.basename(f) for f in glob.glob("archive/*.csv.gz"))}
          json.dump(etat, open("etat.json", "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          print(json.dumps({k: etat[k] for k in ("points", "horodatage_max", "types_de_donnees", "valeurs_par_point")}, ensure_ascii=False))
          # référentiel des points de mesure : coordonnées tirées des fichiers XML (measurementSiteRecord) ou CSV (colonnes de latitude et longitude)
          import math, re, unicodedata
          def l93(x, y):                                                     # Lambert-93 vers longitude, latitude (RGF93 ≈ WGS84)
              n, c, xs, ys, e = 0.7256077650, 11754255.426, 700000.0, 12655612.050, 0.0818191910428
              R = math.hypot(x - xs, y - ys); g = math.atan((x - xs) / (ys - y)); lon = 3 + math.degrees(g / n)
              L = -math.log(abs(R / c)) / n; phi = 2 * math.atan(math.exp(L)) - math.pi / 2
              for _ in range(8): phi = 2 * math.atan(((1 + e * math.sin(phi)) / (1 - e * math.sin(phi))) ** (e / 2) * math.exp(L)) - math.pi / 2
              return lon, math.degrees(phi)
          ref = {}
          for f in sorted(glob.glob("brut/*.xml")):
              try:
                  for ev, el in ET.iterparse(f, events=("end",)):
                      if loc(el.tag) != "measurementSiteRecord": continue
                      sid = el.get("id"); la = lo = None; route = sens = None
                      for c in el.iter():
                          cn = loc(c.tag); tx = (c.text or "").strip()
                          if cn == "latitude" and la is None: la = nombre(tx)
                          elif cn == "longitude" and lo is None: lo = nombre(tx)
                          elif cn in ("roadNumber", "roadName") and not route and tx: route = tx
                          elif cn in ("directionBound", "tpegDirection", "directionRelative") and not sens and tx: sens = tx
                      if sid and la is not None and lo is not None: ref[sid] = (lo, la, route, sens, None, None)
                      el.clear()
              except ET.ParseError: pass
          def norm(h): return re.sub(r"[^a-z0-9]", "", unicodedata.normalize("NFD", h.lower()).encode("ascii", "ignore").decode())
          refsec = {}                                                        # id -> (pr_debut sans côté, abscisse arrondie, axe) pour regrouper les deux sens
          for f in sorted(glob.glob("brut/*.csv")):
              try:
                  txt = open(f, encoding="utf-8-sig", errors="replace").read()
                  dl = ";" if txt[:2000].count(";") >= txt[:2000].count(",") else ","
                  rows = list(csv.reader(io.StringIO(txt), delimiter=dl))
                  if len(rows) < 2: continue
                  H = [norm(h) for h in rows[0]]
                  if "codepme" in H and "xdeb" in H:
                      # référentiel Bison Futé : les lignes ont souvent une colonne de moins que l'en-tête ;
                      # les colonnes à partir de « axe » s'alignent par la droite
                      ja = H.index("axe")
                      def val(r, nom):
                          j = H.index(nom)
                          if len(r) == len(H) or j < ja: return r[j] if j < len(r) else ""
                          k = j - (len(H) - len(r)); return r[k] if 0 <= k < len(r) else ""
                      for r in rows[1:]:
                          if not r or not r[0].strip(): continue
                          xd, yd, xf, yf = (nombre(val(r, c)) for c in ("xdeb", "ydeb", "xfin", "yfin"))
                          if xd is None or yd is None or not (xd > 1000 and yd > 1000): continue
                          lo1, la1 = l93(xd, yd)
                          lo2, la2 = l93(xf, yf) if (xf and yf and xf > 1000 and yf > 1000) else (lo1, la1)
                          if not (-6 <= lo1 <= 10 and 41 <= la1 <= 52): continue
                          sid = r[0].strip(); axe = val(r, "axe").strip() or None
                          ref[sid] = ((lo1 + lo2) / 2, (la1 + la2) / 2, axe, val(r, "senscardinal").strip() or None, (lo1, la1, lo2, la2), nombre(val(r, "longueur")))
                          prd = re.sub(r"[DG]$", "", val(r, "prdebut").strip()); ab = nombre(val(r, "abscissedebut"))
                          if axe and prd: refsec[sid] = (axe, prd, round((ab or 0) / 100))
                      continue
                  def col(cands, excl=()):
                      for i, h in enumerate(H):
                          if any(h == c or h.startswith(c) for c in cands) and not any(x in h for x in excl): return i
                      return None
                  ci = col(["identifiant", "idpoint", "id", "code", "point", "site", "station", "mst"])
                  cla = col(["latitude", "lat", "y", "ywgs", "coordy"]); clo = col(["longitude", "lon", "lng", "long", "x", "xwgs", "coordx"], ("lat",))
                  cro = col(["route", "axe", "voie", "nomroute", "numroute"]); cse = col(["sens", "direction"])
                  if ci is None or cla is None or clo is None: continue
                  for r in rows[1:]:
                      if len(r) <= max(ci, cla, clo): continue
                      a, b = nombre(r[clo]), nombre(r[cla])
                      if a is None or b is None: continue
                      if a > 1000 and b > 1000: a, b = l93(a, b)
                      if -6 <= a <= 10 and 41 <= b <= 52:
                          ref.setdefault(r[ci].strip(), (a, b, r[cro].strip() if cro is not None and len(r) > cro else None, r[cse].strip() if cse is not None and len(r) > cse else None, None, None))
              except Exception as e:
                  erreurs.append(os.path.basename(f) + " : " + str(e))
          # rapprochement des identifiants (exact, puis sans ponctuation ni casse)
          cle = lambda s: re.sub(r"[^A-Z0-9]", "", s.upper())
          refn = {cle(k): v for k, v in ref.items()}
          jour = dt.datetime.now(PARIS).strftime("%Y-%m-%d"); hor = {}
          fa = "archive/" + jour + ".csv.gz"
          if os.path.exists(fa):
              with gzip.open(fa, "rt", encoding="utf-8") as fi:
                  for r in csv.DictReader(fi, delimiter=";"):
                      d = hor.setdefault(r["point"], ([None] * 24, [None] * 24)); hh = int(r["heure"])
                      if int(r["n_debit"]): d[0][hh] = round(float(r["somme_debit"]) / int(r["n_debit"]))
                      if int(r["n_vitesse"]): d[1][hh] = round(float(r["somme_vitesse"]) / int(r["n_vitesse"]), 1)
          # une entrée par section : les deux sens d'une même section (même axe, même PR de début, même abscisse à 100 m près)
          # sont regroupés ; débit = moyenne par sens, vitesse = moyenne pondérée par le débit
          groupes = collections.OrderedDict()
          for sid in sorted(sites):
              g = ref.get(sid) or refn.get(cle(sid))
              if not g: continue
              k = refsec.get(sid) or ("id", sid)
              groupes.setdefault(k, []).append((sid, g))
          def moy(vals, poids=None):
              v = [(x, (poids[i] if poids else 1)) for i, x in enumerate(vals) if x is not None and (not poids or poids[i] is not None)]
              sw = sum(w for x, w in v)
              return sum(x * w for x, w in v) / sw if v and sw else (sum(x for x, w in v) / len(v) if v else None)
          pts = []
          for k, membres in groupes.items():
              qs, vs, qhs, vhs = [], [], [], []
              for sid, g in membres:
                  t, de, vi = sites[sid]
                  qs.append(sum(de) if de else None); vs.append(sum(vi) / len(vi) if vi else None)
                  qh, vh = hor.get(sid, ([None] * 24, [None] * 24)); qhs.append(qh); vhs.append(vh)
              g0 = membres[0][1]
              lon = sum(m[1][0] for m in membres) / len(membres); lat = sum(m[1][1] for m in membres) / len(membres)
              q = moy(qs); v = moy(vs, qs)
              qh = [None if moy([a[h] for a in qhs]) is None else round(moy([a[h] for a in qhs])) for h in range(24)]
              vh = [None if moy([a[h] for a in vhs], [b[h] for b in qhs]) is None else round(moy([a[h] for a in vhs], [b[h] for b in qhs]), 1) for h in range(24)]
              e = {"id": "+".join(m[0] for m in membres), "lon": round(lon, 6), "lat": round(lat, 6), "route": g0[2], "sens": len(membres),
                   "t": sites[membres[0][0]][0], "q": None if q is None else round(q), "v": None if v is None else round(v, 1), "qh": qh, "vh": vh}
              if g0[4]: e["sec"] = [round(c, 6) for c in g0[4]]
              if g0[5]: e["long"] = round(g0[5])
              pts.append(e)
          json.dump({"maj": dt.datetime.now(PARIS).isoformat(timespec="seconds"), "jour": jour, "points": pts}, open("points.json", "w", encoding="utf-8"), separators=(",", ":"))
          etat["referentiel"] = len(ref); etat["sections_localisees"] = len(pts); etat["erreurs"] = erreurs
          json.dump(etat, open("etat.json", "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          print("référentiel :", len(ref), "points localisés ;", len(pts), "sections avec mesures et coordonnées (deux sens regroupés)")
          if not sites: raise SystemExit("Aucun point de mesure lu dans les fichiers XML (voir etat.json et le dossier brut)")
          PY

      - name: Trafic Ville de Paris (capteurs permanents, une fois par jour)
        id: paris
        continue-on-error: true
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          # Débits horaires des capteurs permanents de la Ville de Paris (rues et boulevard périphérique), publiés une fois par jour en J-1
          # sur opendata.paris.fr : sept derniers jours, profil horaire moyen par arc et par type de jour (ouvré, samedi, dimanche),
          # coordonnées tirées du référentiel géographique (jointure par iu_ac). Une fois par jour, après 6 h, jusqu'à obtenir la veille.
          import json, os, gzip, time, urllib.request, urllib.parse, urllib.error, datetime as dt
          from zoneinfo import ZoneInfo
          PARIS = ZoneInfo("Europe/Paris"); maintenant = dt.datetime.now(PARIS); auj = maintenant.date(); hier = (auj - dt.timedelta(days=1)).isoformat()
          force = os.environ.get("FORCE") == "true"; os.makedirs("out/trafic", exist_ok=True); os.chdir("out/trafic")
          def lire(f, defaut):
              try: return json.load(open(f, encoding="utf-8"))
              except Exception: return defaut
          anc, etat = lire("paris.json", {}), lire("paris_etat.json", {})
          if not force:
              if anc.get("dernier") == hier: print("Paris : déjà à jour (", hier, ")"); raise SystemExit(0)
              if maintenant.hour < 6: print("Paris : avant 6 h"); raise SystemExit(0)
              if etat.get("essai") and maintenant - dt.datetime.fromisoformat(etat["essai"]) < dt.timedelta(minutes=55): print("Paris : dernier essai il y a moins d'une heure"); raise SystemExit(0)
          etat["essai"] = maintenant.isoformat(timespec="seconds")
          API = os.environ.get("PARIS_API") or "https://opendata.paris.fr/api/explore/v2.1/catalog/datasets/"
          def get(url, delai=240):
              req = urllib.request.Request(url, headers={"User-Agent": "IATMO", "Accept-Encoding": "gzip"})
              with urllib.request.urlopen(req, timeout=delai) as r:
                  b = r.read(); return gzip.decompress(b) if r.headers.get("Content-Encoding") == "gzip" else b
          def export(ds, select, where=None):
              p = {"select": select, "timezone": "Europe/Paris"}
              if where: p["where"] = where
              return json.loads(get(API + ds + "/exports/json?" + urllib.parse.urlencode(p)))
          def champs(ds):
              try: return sorted(json.loads(get(API + ds + "/records?limit=1"))["results"][0].keys())
              except Exception as e: return "inconnus (" + str(e)[:80] + ")"
          def fin(msg):
              etat["erreur"] = msg; json.dump(etat, open("paris_etat.json", "w", encoding="utf-8"), ensure_ascii=False, indent=1); raise SystemExit(msg)
          debut = (auj - dt.timedelta(days=7)).isoformat(); t0 = time.time()
          try: rows = export("comptages-routiers-permanents", "iu_ac,t_1h,q", f"t_1h > date'{debut}'")
          except urllib.error.HTTPError as e: etat["champs_trafic"] = champs("comptages-routiers-permanents"); fin(f"export du trafic refusé (HTTP {e.code})")
          # référentiel géographique : renouvelé chaque semaine
          ref = lire("paris_ref.json", {})
          if force or not ref.get("arcs") or ref.get("maj", "")[:10] < (auj - dt.timedelta(days=7)).isoformat():
              try: geo = export("referentiel-comptages-routiers", "iu_ac,libelle,geo_point_2d,geo_shape")
              except urllib.error.HTTPError as e:
                  etat["champs_referentiel"] = champs("referentiel-comptages-routiers")
                  if not ref.get("arcs"): fin(f"export du référentiel refusé (HTTP {e.code})")
                  geo = None
              if geo is not None:
                  arcs = {}
                  for g in geo:
                      iu = g.get("iu_ac"); sh = g.get("geo_shape") or {}; sh = sh.get("geometry", sh)
                      lignes = [sh["coordinates"]] if sh.get("type") == "LineString" else sh.get("coordinates", []) if sh.get("type") == "MultiLineString" else []
                      bouts = [p for l in lignes if l for p in (l[0], l[-1])]
                      if iu is None or not bouts: continue
                      a = arcs.setdefault(str(iu), {"lib": g.get("libelle") or "", "bouts": [], "pt": g.get("geo_point_2d")}); a["bouts"] += bouts
                  sortie = {}
                  for iu, a in arcs.items():
                      b = a["bouts"]; best = (0, b[0], b[-1])
                      for i in range(len(b)):
                          for j in range(i + 1, len(b)):
                              d = (b[i][0] - b[j][0]) ** 2 + (b[i][1] - b[j][1]) ** 2
                              if d > best[0]: best = (d, b[i], b[j])
                      pt = a["pt"] or {}; lon = pt.get("lon", (best[1][0] + best[2][0]) / 2); lat = pt.get("lat", (best[1][1] + best[2][1]) / 2)
                      sortie[iu] = [round(lon, 6), round(lat, 6), a["lib"], [round(best[1][0], 6), round(best[1][1], 6), round(best[2][0], 6), round(best[2][1], 6)]]
                  ref = {"maj": maintenant.isoformat(timespec="seconds"), "arcs": sortie}
                  json.dump(ref, open("paris_ref.json", "w", encoding="utf-8"), ensure_ascii=False, separators=(",", ":"))
          # débits par jour, arc et heure (heure de Paris du début de la période : l'horodate marque la fin de l'heure)
          jours = {}
          for r in rows:
              iu, t, q = r.get("iu_ac"), r.get("t_1h"), r.get("q")
              if iu is None or t is None or q is None or q < 0: continue
              tp = dt.datetime.fromisoformat(str(t).replace("Z", "+00:00")).astimezone(PARIS) - dt.timedelta(hours=1)
              jours.setdefault(tp.date().isoformat(), {}).setdefault(str(iu), [None] * 24)[tp.hour] = q
          narcs = max((len(v) for v in jours.values()), default=0)
          complets = sorted(d for d, v in jours.items() if d < auj.isoformat() and sum(1 for x in v.values() if sum(1 for y in x if y is not None) >= 20) >= 0.5 * narcs)
          etat.update({"lignes": len(rows), "jours_lus": sorted(jours), "jours_complets": complets, "duree_s": round(time.time() - t0)})
          if not complets: fin("aucun jour complet dans les données")
          def type_jour(d): w = dt.date.fromisoformat(d).weekday(); return "o" if w < 5 else "s" if w == 5 else "d"
          arcs = []
          for iu, (lon, lat, lib, sec) in ref["arcs"].items():
              prof = {}
              for ty in "osd":
                  ds = [jours[d][iu] for d in complets if type_jour(d) == ty and iu in jours[d]]
                  if not ds: continue
                  p = []
                  for h in range(24):
                      v = [x[h] for x in ds if x[h] is not None]; p.append(round(sum(v) / len(v)) if v else None)
                  if sum(1 for x in p if x is not None) >= 12: prof[ty] = p
              if prof: arcs.append({"id": iu, "lon": lon, "lat": lat, "lib": lib, "sec": sec, "p": prof})
          paris = {"maj": maintenant.isoformat(timespec="seconds"), "dernier": complets[-1], "jours": complets,
                   "source": "Ville de Paris, comptages routiers permanents (opendata.paris.fr, Licence ODbL) : débit horaire moyen par type de jour (o ouvré, s samedi, d dimanche), heure de Paris du début de la période",
                   "arcs": arcs}
          json.dump(paris, open("paris.json", "w", encoding="utf-8"), ensure_ascii=False, separators=(",", ":"))
          etat.update({"arcs": len(arcs), "dernier": complets[-1], "erreur": None})
          json.dump(etat, open("paris_etat.json", "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          print("Paris :", len(rows), "lignes,", len(arcs), "arcs localisés, jours", complets[0], "à", complets[-1])
          if complets[-1] != hier: print("Paris : la veille n'est pas encore publiée, nouvel essai dans une heure")
          PY

      - name: AROME (vent à 10 m et pluie, aujourd'hui et demain, métropole et DROM)
        id: arome
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/arome
          python3 -m pip install -q --user --break-system-packages eccodes numpy >/dev/null 2>&1 || python3 -m pip install -q --user eccodes numpy >/dev/null
          python3 - <<'PY'
          # Vent à 10 m (10u, 10v, paquet SP1) et pluie (tirf, tsnowp, paquet SP2) des calculs AROME de Météo-France, heure par heure,
          # pour le jour même et le lendemain : AROME 0,01° sur la métropole (moyenne sur des carrés de 0,1°) et AROME Outre-Mer 0,025°
          # sur les DROM (carrés de 0,05°, 0,1° en Guyane). Seuls les messages utiles sont téléchargés (requêtes partielles).
          # Métropole : heures de Paris ; DROM : heures locales. Jour même en métropole : renouvelé à chaque nouveau calcul ;
          # lendemain et DROM : renouvelés quand un calcul plus récent d'au moins 6 h est disponible. Budget de 7 minutes par passage.
          import json, os, time, datetime as dt, urllib.request, urllib.error, re, glob, warnings
          from zoneinfo import ZoneInfo
          import numpy as np, eccodes
          warnings.simplefilter("ignore")
          PARIS = ZoneInfo("Europe/Paris"); UTC = dt.timezone.utc
          os.chdir("out/arome"); BASE = os.environ["AROME_BASE"]; force = os.environ.get("FORCE") == "true"
          def requete(url, debut=None, fin=None, tete=False, delai=120):
              req = urllib.request.Request(url, method="HEAD" if tete else "GET", headers={"User-Agent": "IATMO"})
              if debut is not None: req.add_header("Range", "bytes=%d-%d" % (debut, fin))
              with urllib.request.urlopen(req, timeout=delai) as r: return b"" if tete else r.read()
          def url_om(dom): return lambda run, p, pas: f"{BASE}/pnt/{run}/arome-om/{dom}/0025/{p}/arome-om-{dom}__0025__{p}__{pas:03d}H__{run}.grib2"
          DOMS = {"METRO": lambda run, p, pas: f"{BASE}/pnt/{run}/arome/001/{p}/arome__001__{p}__{pas:02d}H__{run}.grib2",
                  "ANTIL": url_om("ANTIL"), "GUYANE": url_om("GUYANE"), "INDIEN": url_om("INDIEN")}
          BOITES = {  # nom : (domaine AROME, fuseau, latitude du bord nord, longitude du bord ouest, pas, ni, nj)
              "METRO": ("METRO", "Europe/Paris", 51.5, -5.5, 0.1, 155, 105),
              "GUADELOUPE": ("ANTIL", "America/Guadeloupe", 16.6, -61.9, 0.05, 20, 16),
              "MARTINIQUE": ("ANTIL", "America/Martinique", 15.0, -61.3, 0.05, 12, 14),
              "GUYANE": ("GUYANE", "America/Cayenne", 6.0, -54.8, 0.1, 34, 40),
              "REUNION": ("INDIEN", "Indian/Reunion", -20.8, 55.1, 0.05, 16, 14),
              "MAYOTTE": ("INDIEN", "Indian/Mayotte", -12.6, 44.9, 0.05, 10, 10)}
          OM = ["GUADELOUPE", "MARTINIQUE", "GUYANE", "REUNION", "MAYOTTE"]
          T = {b: BOITES[b][5] * BOITES[b][6] for b in BOITES}; N = T["METRO"]
          OFF, TOM = {}, 0
          for b in OM: OFF[b] = TOM; TOM += 24 * 3 * T[b]
          maintenant = dt.datetime.now(PARIS); J0 = maintenant.strftime("%Y-%m-%d"); J1 = (maintenant.date() + dt.timedelta(days=1)).isoformat()
          def groupe(b): return "METRO" if b == "METRO" else "OM"
          def fichier(g, j): return f"{j}.bin" if g == "METRO" else f"om-{j}.bin"
          etat = {}
          if os.path.exists("etat.json"):
              try: etat = json.load(open("etat.json", encoding="utf-8"))
              except Exception: etat = {}
          anc = {}
          if os.path.exists("meteo.json"):
              try: anc = json.load(open("meteo.json", encoding="utf-8"))
              except Exception: anc = {}
          index = {}                                                                  # "jour|boîte" -> calcul utilisé pour chacune des 24 heures
          if anc.get("jour"): index[anc["jour"] + "|METRO"] = anc.get("heures")
          if (anc.get("lendemain") or {}).get("jour"): index[anc["lendemain"]["jour"] + "|METRO"] = anc["lendemain"].get("heures")
          for j, d in ((anc.get("om") or {}).get("jours") or {}).items():
              for b, hs in d.items(): index[j + "|" + b] = hs
          def vide(g):
              buf = np.zeros(24 * 3 * N if g == "METRO" else TOM, dtype=np.uint8)
              for b in (["METRO"] if g == "METRO" else OM):
                  t, o = T[b], (0 if g == "METRO" else OFF[b])
                  for h in range(24): base = o + h * 3 * t; buf[base:base + 2 * t] = 128; buf[base + 2 * t:base + 3 * t] = 255   # int8 -128 et 255 = absent
              return buf
          bufs = {}
          for g in ("METRO", "OM"):
              for j in (J0, J1):
                  f, attendu, buf = fichier(g, j), (24 * 3 * N if g == "METRO" else TOM), None
                  if os.path.exists(f):
                      x = np.frombuffer(open(f, "rb").read(), dtype=np.uint8).copy()
                      if x.size == attendu: buf = x
                  if buf is None:
                      buf = vide(g)
                      for b in (["METRO"] if g == "METRO" else OM): index[j + "|" + b] = None
                  bufs[(g, j)] = buf
          index = {k: (v if isinstance(v, list) and len(v) == 24 else [None] * 24) for k, v in index.items() if k[:10] in (J0, J1)}
          for b in BOITES:
              for j in (J0, J1): index.setdefault(j + "|" + b, [None] * 24)
          # calculs présents sur le stockage
          try:
              corps = requete(BASE + "/?list-type=2&prefix=pnt/&delimiter=/").decode("utf-8", "replace")
              runs = sorted(set(re.findall(r"<Prefix>pnt/(\d{4}-\d\d-\d\dT\d\d:00:00Z)/</Prefix>", corps)))
          except Exception:
              t = dt.datetime.now(UTC).replace(minute=0, second=0, microsecond=0); t = t.replace(hour=t.hour - t.hour % 3)
              runs = [(t - dt.timedelta(hours=3 * k)).strftime("%Y-%m-%dT%H:%M:%SZ") for k in range(8)][::-1]
          runs = runs[-8:]; recents = runs[::-1]
          def date_run(run): return dt.datetime.strptime(run, "%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=UTC)
          def messages(u):
              """Liste (décalage, longueur) des messages GRIB2 d'un fichier, par lecture des 16 premiers octets de chacun."""
              out, o = [], 0
              while True:
                  try: tete = requete(u, o, o + 15)
                  except urllib.error.HTTPError as e:
                      if e.code == 416: break
                      raise
                  if len(tete) < 16 or tete[:4] != b"GRIB": break
                  L = int.from_bytes(tete[8:16], "big"); out.append((o, L)); o += L
                  if len(out) > 60: break
              return out
          RANGS = etat.get("rangs") or {}                                             # rang des messages, appris au premier passage
          RANGS.setdefault("METRO", {"SP1": {"10u": 2, "10v": 3}, "SP2": {"tirf": 7, "tsnowp": 8}})
          NOMS, CACHE = {}, {}
          def champs(u, voulus, dom, paquet):
              """Champs complets {nom: (valeurs nord→sud, lat nord, lon ouest, dx, dy, stepRange)}, gardés en mémoire pendant le passage."""
              res = {sn: CACHE[(u, sn)] for sn in voulus if (u, sn) in CACHE}
              manquants = [sn for sn in voulus if sn not in res]
              if not manquants: return res
              liste = messages(u); rg = RANGS.setdefault(dom, {}).setdefault(paquet, {}); vus = []
              ordre = [rg[sn] for sn in manquants if rg.get(sn, 99) < len(liste)]
              ordre += [k for k in range(len(liste)) if k not in ordre]               # si un rang a changé, on parcourt les autres messages
              for k in ordre:
                  if all(sn in res for sn in voulus): break
                  o, L = liste[k]
                  gid = eccodes.codes_new_from_message(requete(u, o, o + L - 1, delai=300))
                  try:
                      sn = eccodes.codes_get(gid, "shortName"); vus.append(sn)
                      if sn not in manquants or sn in res: continue
                      g = lambda c: eccodes.codes_get(gid, c)
                      la1, lo1, ni, nj = g("latitudeOfFirstGridPointInDegrees"), g("longitudeOfFirstGridPointInDegrees"), g("Ni"), g("Nj")
                      dx, dy = g("iDirectionIncrementInDegrees"), g("jDirectionIncrementInDegrees")
                      v = eccodes.codes_get_values(gid).reshape(nj, ni).astype(np.float32)
                      if g("bitmapPresent"): v[v == g("missingValue")] = np.nan
                      if g("jScansPositively") == 1: v = v[::-1]; la1 = la1 + (nj - 1) * dy
                      if lo1 > 180: lo1 -= 360
                      res[sn] = CACHE[(u, sn)] = (v, la1, lo1, dx, dy, str(g("stepRange"))); rg[sn] = k
                  finally: eccodes.codes_release(gid)
              while sum(c[0].nbytes for c in CACHE.values()) > 3e8: del CACHE[next(iter(CACHE))]
              if any(sn not in res for sn in voulus): NOMS[dom + " " + paquet] = sorted(set(vus))
              return res
          def bloc(c, b):
              """Moyenne du champ sur les carrés de la boîte b (NaN hors de la grille du modèle)."""
              v, la1, lo1, dx, dy, _ = c; _, _, lat0, lon0, pas, ni, nj = BOITES[b]
              k = int(round(pas / dx)); j0 = int(round((la1 - lat0) / dy)); i0 = int(round((lon0 - lo1) / dx))
              if j0 >= 0 and i0 >= 0 and j0 + nj * k <= v.shape[0] and i0 + ni * k <= v.shape[1]: sub = v[j0:j0 + nj * k, i0:i0 + ni * k]
              else:
                  sub = np.full((nj * k, ni * k), np.nan, dtype=np.float32)
                  js, je, is_, ie = max(0, j0), min(v.shape[0], j0 + nj * k), max(0, i0), min(v.shape[1], i0 + ni * k)
                  if je > js and ie > is_: sub[js - j0:je - j0, is_ - i0:ie - i0] = v[js:je, is_:ie]
              return np.nanmean(sub.reshape(nj, k, ni, k), axis=(1, 3))
          def extraire(b, run, pas):
              dom = BOITES[b][0]; U = DOMS[dom]
              a = champs(U(run, "SP1", pas), {"10u", "10v"}, dom, "SP1")
              if "10u" not in a or "10v" not in a: raise ValueError("vent absent de SP1")
              voulus = {"tirf", "tsnowp"} if dom == "METRO" else {"tirf"}
              c = champs(U(run, "SP2", pas), voulus, dom, "SP2"); pluie = None
              for sn in sorted(voulus):
                  if sn not in c: continue
                  val = bloc(c[sn], b); sr = c[sn][5]; d0, d1 = (int(x) for x in sr.split("-")) if "-" in sr else (pas - 1, pas)
                  if d1 - d0 > 1:                                                     # cumul depuis le début du calcul : différence avec l'échéance précédente
                      prec = champs(U(run, "SP2", pas - 1), {sn}, dom, "SP2").get(sn) if pas > 1 else None
                      val = val - bloc(prec, b) if prec else val / max(1, d1 - d0)
                  val = np.maximum(val, 0); pluie = val if pluie is None else pluie + val
              return bloc(a["10u"], b), bloc(a["10v"], b), pluie
          def ecrire(b, j, h, u, v, p):
              t = T[b]; buf = bufs[(groupe(b), j)]; base = (0 if b == "METRO" else OFF[b]) + h * 3 * t
              i8 = lambda x: np.where(np.isnan(x), -128, np.clip(np.round(x * 4), -127, 127)).astype(np.int8).ravel().view(np.uint8)
              buf[base:base + t] = i8(u); buf[base + t:base + 2 * t] = i8(v)
              if p is None: p = np.full(t, np.nan)
              buf[base + 2 * t:base + 3 * t] = np.where(np.isnan(p), 255, np.clip(np.round(p * 10), 0, 254)).astype(np.uint8).ravel()
          # ordre de priorité : métropole aujourd'hui, DROM aujourd'hui, métropole demain, DROM demain (DROM heure par heure, boîtes ensemble)
          taches = [("METRO", J0, h) for h in range(24)] + [(b, J0, h) for h in range(24) for b in OM] + \
                   [("METRO", J1, h) for h in range(24)] + [(b, J1, h) for h in range(24) for b in OM]
          faits, essais, absents = [], [], set(); debut = time.monotonic()
          for b, j, h in taches:
              if time.monotonic() - debut > 420: essais.append([b, j, h, None, None, "budget atteint"]); break
              tz = ZoneInfo(BOITES[b][1]); y, m, d = map(int, j.split("-"))
              tl = dt.datetime(y, m, d, h, tzinfo=tz); t = tl.astimezone(UTC); passe = dt.datetime.now(tz) - dt.timedelta(hours=2) > tl
              cle = j + "|" + b; actuel = index[cle][h]; ecart = 0 if (b == "METRO" and j == J0) else 6
              for run in recents:
                  r = date_run(run); pas = int((t - r).total_seconds() // 3600)
                  if pas < 1 or pas > 48: continue
                  if actuel == run: break
                  if actuel is not None and not force and (passe or (r - date_run(actuel)).total_seconds() < max(ecart, 0.5) * 3600): break
                  dom = BOITES[b][0]
                  if (dom, run, pas) in absents: continue
                  try: requete(DOMS[dom](run, "SP1", pas), tete=True); requete(DOMS[dom](run, "SP2", pas), tete=True)
                  except Exception: absents.add((dom, run, pas)); essais.append([b, j, h, run, pas, "absent"]); continue
                  try:
                      u, v, p = extraire(b, run, pas); ecrire(b, j, h, u, v, p)
                      index[cle][h] = run; faits.append([b, j, h, run, pas]); break
                  except Exception as e:
                      essais.append([b, j, h, run, pas, str(e)[:160]])
          for (g, j), buf in bufs.items(): open(fichier(g, j), "wb").write(buf.tobytes())
          def point(b, j, lat, lon, h):
              _, _, lat0, lon0, pas, ni, nj = BOITES[b]; jj = int((lat0 - lat) / pas); ii = int((lon - lon0) / pas)
              if index[j + "|" + b][h] is None or not (0 <= jj < nj and 0 <= ii < ni): return None
              t = T[b]; buf = bufs[(groupe(b), j)]; base = (0 if b == "METRO" else OFF[b]) + h * 3 * t; k = jj * ni + ii
              u = buf[base + k:base + k + 1].view(np.int8)[0] / 4; v = buf[base + t + k:base + t + k + 1].view(np.int8)[0] / 4; p = int(buf[base + 2 * t + k])
              return {"vitesse": round(float(np.hypot(u, v)), 2), "direction": round(float((np.degrees(np.arctan2(-u, -v)) + 360) % 360)), "pluie": None if p == 255 else p / 10}
          def boite_json(b):
              _, tz, lat0, lon0, pas, ni, nj = BOITES[b]
              return {"fuseau": tz, "lat0": lat0, "lon0": lon0, "pas": pas, "ni": ni, "nj": nj, "decalage": OFF.get(b, 0), "echelle_vent": 0.25, "echelle_pluie": 0.1}
          meteo = {"jour": J0, "maj": maintenant.isoformat(timespec="seconds"), "calculs": runs,
                   "grille": dict(boite_json("METRO"), format="24 heures × (u int8, v int8, pluie uint8), rangées du nord au sud ; -128 et 255 = absent"),
                   "heures": index[J0 + "|METRO"], "lendemain": {"jour": J1, "heures": index[J1 + "|METRO"]},
                   "om": {"fichier": "om-AAAA-MM-JJ.bin", "format": "boîtes à la suite (décalage en octets), chacune 24 heures locales × (u, v, pluie)",
                          "boites": {b: boite_json(b) for b in OM}, "jours": {j: {b: index[j + "|" + b] for b in OM} for j in (J0, J1)}}}
          json.dump(meteo, open("meteo.json", "w", encoding="utf-8"), ensure_ascii=False)
          hp = min(23, maintenant.hour); rempli = lambda k: sum(1 for x in index[k] if x)
          etat = {"maj": meteo["maj"], "calculs": runs, "heures_remplies": rempli(J0 + "|METRO"),
                  "heures_remplies_par_boite": {k: rempli(k) for k in sorted(index)}, "extraits_ce_passage": faits, "echecs": essais[-20:],
                  "rangs": RANGS, "noms_vus_si_champ_absent": NOMS,
                  "Paris_heure_courante": point("METRO", J0, 48.857, 2.352, hp), "Lyon_heure_courante": point("METRO", J0, 45.760, 4.835, hp),
                  "Fort-de-France_12h_locale": point("MARTINIQUE", J0, 14.61, -61.07, 12), "Saint-Denis_12h_locale": point("REUNION", J0, -20.88, 55.45, 12),
                  "Cayenne_12h_locale": point("GUYANE", J0, 4.94, -52.33, 12)}
          json.dump(etat, open("etat.json", "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          lim, lim_om = (maintenant - dt.timedelta(days=30)).strftime("%Y-%m-%d"), (maintenant - dt.timedelta(days=3)).strftime("%Y-%m-%d")
          for f in glob.glob("*.bin"):                                                # archive : 30 jours en métropole, 3 jours outre-mer
              mm = re.match(r"(om-)?(\d{4}-\d\d-\d\d)\.bin$", f)
              if mm and mm.group(2) < (lim_om if mm.group(1) else lim): os.remove(f)
          print(json.dumps({k: etat[k] for k in ("heures_remplies", "Paris_heure_courante", "Fort-de-France_12h_locale", "Saint-Denis_12h_locale")}, ensure_ascii=False), "|", len(faits), "heures extraites")
          if not any(index[J0 + "|METRO"]): raise SystemExit("Aucune heure AROME extraite pour la métropole (voir arome/etat.json)")
          PY

      - name: Historique (calage et performances, une fois par jour après 4 h)
        id: historique
        continue-on-error: true
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          cd out
          J="$(TZ=Europe/Paris date +%F)"; H="$(TZ=Europe/Paris date +%-H)"
          if [ "${FORCE:-false}" != "true" ]; then
            if [ "$H" -lt 4 ]; then echo "Avant 4 h : le LCSQA n'a pas encore publié la fin de la veille."; exit 0; fi
            if [ -f calage/calage.json ] && grep -q "\"maj\":\"$J" calage/calage.json; then echo "Historique déjà calculé aujourd'hui."; exit 0; fi
          fi
          # Script et référentiels sur la branche principale du dépôt, à la racine (historique.py, stations_ref.json, fiches_stations.json)
          # ou dans les dossiers outils/ et ref/
          git fetch -q --depth 1 origin main
          rm -rf /tmp/ref && mkdir -p /tmp/ref
          for f in historique.py stations_ref.json fiches_stations.json; do
            git show "FETCH_HEAD:$f" > "/tmp/ref/$f" 2>/dev/null || git show "FETCH_HEAD:outils/$f" > "/tmp/ref/$f" 2>/dev/null || git show "FETCH_HEAD:ref/$f" > "/tmp/ref/$f"
          done
          python3 -c "import numpy" 2>/dev/null || python3 -m pip install -q --user --break-system-packages numpy >/dev/null 2>&1 || python3 -m pip install -q --user numpy >/dev/null
          # scikit-learn : correction apprise des résidus (gradient boosting) ; sans lui, historique.py saute cette évaluation
          python3 -c "import sklearn" 2>/dev/null || python3 -m pip install -q --user --break-system-packages scikit-learn >/dev/null 2>&1 || python3 -m pip install -q --user scikit-learn >/dev/null 2>&1 || echo "scikit-learn non installé"
          python3 /tmp/ref/historique.py . /tmp/ref

      - name: Publier sur la branche donnees
        if: steps.lcsqa.outcome == 'success' || steps.trafic.outcome == 'success' || steps.paris.outcome == 'success' || steps.arome.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          cd out
          printf '%s\n' "Copie automatique de données publiques pour IATMO." \
            "Licences : Licence Ouverte (Etalab), sauf trafic/paris.json, base dérivée du jeu « Comptage routier – Données trafic issues des capteurs permanents » de la Ville de Paris, diffusée sous ODbL (Open Database License) : toute réutilisation cite « Ville de Paris » et reste sous ODbL. Sources à citer : Météo-France (arome/), LCSQA – Geod'air (lcsqa/, archive/), Bison Futé (trafic/points.json)." \
            "Contenu :" \
            "- lcsqa/ : fichiers temps réel du LCSQA (data.gouv.fr), jour et veille ;" \
            "- trafic/ : débits et vitesses Bison Futé sur le réseau national non concédé (data.gouv.fr) : fichiers bruts du moment, dernier état par point, points.json pour IATMO, archive horaire de 60 jours ; paris.json : débits horaires des capteurs permanents de la Ville de Paris (opendata.paris.fr, ODbL), moyenne par type de jour sur les 7 derniers jours ;" \
            "- arome/ : vent à 10 m et pluie AROME (Météo-France) heure par heure, aujourd'hui et demain : métropole sur une grille de 0,1° (AAAA-MM-JJ.bin, 30 jours gardés), DROM en AROME Outre-Mer (om-AAAA-MM-JJ.bin) ;" \
            "- archive/lcsqa/ : mesures horaires du LCSQA par station (NO, NO2, NOx, O3, PM10, PM2,5, SO2), un fichier compressé par jour sur 180 jours, et table des stations ;" \
            "- suivi/ : journal des passages (3 jours), première apparition de chaque heure du LCSQA (30 jours) et performances quotidiennes du krigeage (90 jours), progression du calage (calage_jours.json, 400 jours), lus par l'onglet Évaluation ;" \
            "- calage/ : calage de l'effet routier sur les 30 derniers jours (incrément, profil horaire, vent, pluie, trafic et confinement), lu par la carte." \
            "Branche réécrite à chaque passage par la tâche .github/workflows/copie_lcsqa.yml : ne pas y travailler." > LISEZMOI.txt
          # Journal des passages (3 jours) : heure, durée, déclencheur et résultat de chaque partie, lu par l'onglet Évaluation
          mkdir -p suivi
          LCSQA="${{ steps.lcsqa.outcome }}" TRAFIC="${{ steps.trafic.outcome }}" AROME="${{ steps.arome.outcome }}" HIST="${{ steps.historique.outcome }}" PARIS_T="${{ steps.paris.outcome }}" EVT="${EVENEMENT}" python3 - <<'PY'
          import json, os, time, datetime as dt
          from zoneinfo import ZoneInfo
          f = "suivi/journal.json"
          try: j = json.load(open(f, encoding="utf-8"))
          except Exception: j = []
          deb = int(os.environ.get("DEBUT") or time.time()); P = ZoneInfo("Europe/Paris")
          j.append({"t": dt.datetime.fromtimestamp(deb, P).isoformat(timespec="seconds"), "duree": int(time.time()) - deb, "evt": os.environ["EVT"],
                    "lcsqa": os.environ["LCSQA"], "trafic": os.environ["TRAFIC"], "arome": os.environ["AROME"], "historique": os.environ.get("HIST", ""), "paris": os.environ.get("PARIS_T", "")})
          json.dump(j[-432:], open(f, "w", encoding="utf-8"), ensure_ascii=False, separators=(",", ":"))
          print("journal :", len(j[-432:]), "passages")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          ARBRE="$(git write-tree)"
          COMMIT="$(git commit-tree "$ARBRE" -m "Copie du $(TZ=Europe/Paris date '+%d/%m/%Y à %H:%M') (LCSQA : ${{ steps.lcsqa.outcome }}, trafic : ${{ steps.trafic.outcome }}, AROME : ${{ steps.arome.outcome }})")"
          git push -qf origin "$COMMIT:refs/heads/donnees"
          echo "Copie publiée : https://raw.githubusercontent.com/${REPO}/donnees/LISEZMOI.txt"

      - name: Signaler l'échec de toutes les copies
        if: steps.lcsqa.outcome != 'success' && steps.trafic.outcome != 'success' && steps.arome.outcome != 'success'
        shell: bash
        run: |
          echo "Ni les mesures du LCSQA ni le trafic n'ont pu être copiés : la branche n'est pas modifiée."; exit 1
